<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .frame { fill: #faf8f3; stroke: #1b1b19; }
    .dot { fill: #b45309; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #191917; stroke: #ecebe4; }
      .dot { fill: #f5a524; }
    }
  </style>
  <rect class="frame" x="2" y="2" width="28" height="28" rx="2" stroke-width="2" />
  <circle class="dot" cx="16" cy="16" r="5" />
</svg>
